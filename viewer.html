<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xem dự án 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8f1; font-family: system-ui, "Segoe UI", sans-serif; }
    #app { position: fixed; inset: 0; }
    #tools { position: fixed; right: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 10; }
    #tools button, #tools a { border: 0; background: rgba(255,255,255,.95); box-shadow: 0 2px 10px rgba(15,23,42,.15); border-radius: 8px; padding: 7px 10px; font-size: 12px; cursor: pointer; color: #1e293b; text-decoration: none; font-family: inherit; }
    #tools button:hover, #tools a:hover { background: #fff; color: #2563eb; }
    @media (max-width: 600px) { #tools { bottom: auto; top: 12px; right: 12px; } #tools .opt { display: none; } }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
  <script src="sample-data.js"></script>
  <script src="building3d.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="tools">
    <button id="btnImport" class="opt">Nhập JSON</button>
    <button id="btnSample" class="opt">Dữ liệu mẫu</button>
    <a href="admin.html" class="opt">Trang admin</a>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const viewer = Project3D.create(THREE, { OrbitControls, CSS2DRenderer, CSS2DObject }, document.getElementById('app'));

    // Nguồn dữ liệu theo thứ tự ưu tiên:
    //   1. viewer.html?src=duong-dan.json  (khi chạy trên server / API)
    //   2. dữ liệu admin đã lưu trong trình duyệt (localStorage)
    //   3. dữ liệu mẫu
    const KEY = 'project3d';
    function saved() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch { return null; } }

    const src = new URLSearchParams(location.search).get('src');
    if (src) {
      fetch(src).then(r => r.json()).then(d => viewer.load(d)).catch(err => { alert('Không tải được ' + src + ': ' + err.message); viewer.load(SAMPLE_PROJECT); });
    } else {
      viewer.load(saved() || SAMPLE_PROJECT);
    }

    // admin lưu ở tab khác → tự cập nhật
    window.addEventListener('storage', e => { if (e.key === KEY && !src) { const d = saved(); if (d) viewer.load(d, { keepCamera: true }); } });

    const file = document.getElementById('file');
    document.getElementById('btnImport').onclick = () => file.click();
    file.onchange = async () => {
      const f = file.files[0]; if (!f) return;
      try { viewer.load(JSON.parse(await f.text())); } catch (err) { alert('File JSON không hợp lệ: ' + err.message); }
      file.value = '';
    };
    document.getElementById('btnSample').onclick = () => viewer.load(SAMPLE_PROJECT);
  </script>
</body>
</html>
